</defs>
<rect x="1" y="1" width="958" height="114" rx="20" fill="url(#bg)" stroke="#334155"/>
<text x="32" y="31" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#A78BFA">NEXT / LIVE GITHUB LAYER</text>
