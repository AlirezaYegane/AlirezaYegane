<text x="680" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">Public activity</text>
<text x="32" y="92" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#94A3B8">repositories · engineering signals · contribution history</text>
