<svg xmlns="http://www.w3.org/2000/svg" width="960" height="116" viewBox="0 0 960 116" role="img" aria-labelledby="title desc">
<title id="title">Continue to selected repositories and public GitHub activity</title>
<desc id="desc">A visual transition from the profile README to GitHub's native pinned repositories and contribution activity.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#0D1728"/>
    <stop offset="0.5" stop-color="#121A32"/>
    <stop offset="1" stop-color="#0D2726"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#A78BFA"/>
    <stop offset="0.5" stop-color="#38BDF8"/>
