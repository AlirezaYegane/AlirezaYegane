<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Alireza Yegane research mission control</title>
  <desc id="desc">Animated research mission-control panel introducing Alireza Yegane, his role in AI and machine learning, Sydney location, and a visual orbit connecting research, engineering, and delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4F7FC"/><stop offset="1" stop-color="#EAF0F8"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#007FA3" stop-opacity=".35"/><stop offset="1" stop-color="#007FA3" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#C7D4E3" stroke-width="1" opacity=".2"/></pattern>
  </defs>
  <style>
    .orbit { transform-origin: 910px 250px; animation: orbit 24s linear infinite; }
    .orbit-reverse { transform-origin: 910px 250px; animation: orbit-reverse 34s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .dash { animation: dash 10s linear infinite; }
    .cursor { animation: blink 1.1s steps(2,end) infinite; }
    .scan { animation: scan 6s ease-in-out infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes orbit-reverse { to { transform: rotate(-360deg); } }
    @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.96) } 50% { opacity:1; transform:scale(1.05) } }
    @keyframes dash { to { stroke-dashoffset:-180; } }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
    @keyframes scan { 0%,100% { transform:translateY(-24px); opacity:0 } 20%,80% { opacity:.35 } 50% { transform:translateY(365px); opacity:.18 } }
    @media (prefers-reduced-motion: reduce) {
      .orbit,.orbit-reverse,.pulse,.dash,.cursor,.scan { animation:none !important; }
    }
  </style>
  <rect width="1200" height="500" rx="30" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="464" rx="22" fill="url(#grid)" stroke="#C7D4E3" stroke-width="2"/>
  <rect class="scan" x="30" y="42" width="1140" height="3" fill="#007FA3" opacity=".15"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace">
    <circle cx="52" cy="50" r="6" fill="#FF5F57"/><circle cx="74" cy="50" r="6" fill="#FEBC2E"/><circle cx="96" cy="50" r="6" fill="#28C840"/>
    <text x="125" y="57" font-size="15" fill="#52677E">ALIREZA / RESEARCH-MISSION-CONTROL</text>
    <rect x="1000" y="37" width="145" height="28" rx="14" fill="#087F5B" opacity=".13" stroke="#087F5B"/>
    <circle class="pulse" cx="1019" cy="51" r="5" fill="#087F5B"/>
    <text x="1032" y="56" font-size="12" font-weight="700" fill="#087F5B">SYSTEM ONLINE</text>

    <text x="58" y="122" font-size="16" fill="#087F5B">$ whoami</text>
    <text x="58" y="177" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="48" font-weight="800" fill="#132238">Alireza Yegane</text>
    <text x="58" y="218" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#6D28D9">AI/ML Researcher · Data Scientist · Research Software Builder</text>
    <text x="58" y="265" font-size="16" fill="#087F5B">$ objective</text>
    <text x="58" y="299" font-size="19" fill="#132238">build reliable AI &amp; data systems</text>
    <text x="58" y="329" font-size="19" fill="#132238">from evidence -&gt; experiment -&gt; usable software</text>
    <text x="58" y="381" font-size="16" fill="#087F5B">$ coordinates</text>
    <text x="58" y="414" font-size="18" fill="#132238">Sydney, Australia · Research Assistant · Macquarie University</text>
    <text x="58" y="455" font-size="14" fill="#52677E">assert evidence &gt; hype</text><rect class="cursor" x="257" y="440" width="11" height="20" fill="#007FA3"/>
  </g>

  <circle cx="910" cy="250" r="190" fill="url(#glow)" filter="url(#soft)"/>
  <g fill="none" stroke="#C7D4E3" stroke-width="2">
    <circle cx="910" cy="250" r="164"/><circle cx="910" cy="250" r="118" stroke-dasharray="7 9"/><circle cx="910" cy="250" r="72"/>
  </g>
  <g class="orbit" fill="none" stroke="#007FA3" stroke-width="3" stroke-dasharray="12 12"><circle cx="910" cy="250" r="164"/></g>
  <g class="orbit-reverse" fill="none" stroke="#6D28D9" stroke-width="2" stroke-dasharray="5 16"><circle cx="910" cy="250" r="118"/></g>
  <path class="dash" d="M746 250 C790 150 860 120 910 178 C960 236 1020 130 1074 250 C1024 350 956 378 910 322 C864 266 798 370 746 250Z" fill="none" stroke="#087F5B" stroke-width="2" stroke-dasharray="10 10"/>
  <circle cx="910" cy="250" r="48" fill="#FFFFFF" stroke="#007FA3" stroke-width="3"/>
  <text x="910" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="700" fill="#132238">RELIABLE</text>
  <text x="910" y="265" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="700" fill="#132238">SYSTEMS</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700">
    <g><circle class="pulse" cx="910" cy="86" r="11" fill="#6D28D9"/><text x="910" y="67" text-anchor="middle" fill="#6D28D9">RESEARCH</text></g>
    <g><circle class="pulse" cx="1074" cy="250" r="11" fill="#007FA3"/><text x="1080" y="225" text-anchor="middle" fill="#007FA3">BUILD</text></g>
    <g><circle class="pulse" cx="910" cy="414" r="11" fill="#087F5B"/><text x="910" y="448" text-anchor="middle" fill="#087F5B">DELIVER</text></g>
    <g><circle class="pulse" cx="746" cy="250" r="11" fill="#A15C00"/><text x="724" y="225" text-anchor="middle" fill="#A15C00">EVALUATE</text></g>
  </g>
</svg>
