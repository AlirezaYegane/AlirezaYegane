<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-to-output signal path</title><desc id="desc">A five-stage workflow moving from research question to evidence, reproducible experiment, failure analysis, and tested usable output.</desc>
  <rect width="1200" height="270" rx="24" fill="#F4F7FC" stroke="#C7D4E3" stroke-width="2"/>
  <text x="60" y="40" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" fill="#52677E">SIGNAL PATH / HOW THE WORK MOVES</text>
  <rect x="60" y="75" width="178" height="120" rx="18" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2"/>
  <text x="149" y="123" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="800" fill="#6D28D9">QUESTION</text>
  <text x="149" y="157" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#52677E">define the claim</text><rect x="275" y="75" width="178" height="120" rx="18" fill="#FFFFFF" stroke="#007FA3" stroke-width="2"/>
  <text x="364" y="123" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="800" fill="#007FA3">EVIDENCE</text>
  <text x="364" y="157" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#52677E">data + assumptions</text><rect x="490" y="75" width="178" height="120" rx="18" fill="#FFFFFF" stroke="#087F5B" stroke-width="2"/>
  <text x="579" y="123" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="800" fill="#087F5B">EXPERIMENT</text>
  <text x="579" y="157" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#52677E">reproducible run</text><rect x="705" y="75" width="178" height="120" rx="18" fill="#FFFFFF" stroke="#A15C00" stroke-width="2"/>
  <text x="794" y="123" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="800" fill="#A15C00">FAILURE</text>
  <text x="794" y="157" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#52677E">analyse what broke</text><rect x="920" y="75" width="178" height="120" rx="18" fill="#FFFFFF" stroke="#C02654" stroke-width="2"/>
  <text x="1009" y="123" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" font-weight="800" fill="#C02654">OUTPUT</text>
  <text x="1009" y="157" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#52677E">tested + usable</text><path d="M238 135h29" stroke="#C7D4E3" stroke-width="3"/><path d="M260 128l8 7-8 7" fill="none" stroke="#C7D4E3" stroke-width="3"/><path d="M453 135h29" stroke="#C7D4E3" stroke-width="3"/><path d="M475 128l8 7-8 7" fill="none" stroke="#C7D4E3" stroke-width="3"/><path d="M668 135h29" stroke="#C7D4E3" stroke-width="3"/><path d="M690 128l8 7-8 7" fill="none" stroke="#C7D4E3" stroke-width="3"/><path d="M883 135h29" stroke="#C7D4E3" stroke-width="3"/><path d="M905 128l8 7-8 7" fill="none" stroke="#C7D4E3" stroke-width="3"/>
  <text x="600" y="235" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" fill="#52677E">negative results are routed back into the next experiment</text>
</svg>
