<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Research and engineering constellation</title><desc id="desc">A constellation linking RNA foundation models, clinical ontologies, graph machine learning, AI tooling, analytics, and evaluation to reliable AI and data systems.</desc>
  <style>
    .orbit { transform-origin: 910px 250px; animation: orbit 24s linear infinite; }
    .orbit-reverse { transform-origin: 910px 250px; animation: orbit-reverse 34s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .dash { animation: dash 10s linear infinite; }
    .cursor { animation: blink 1.1s steps(2,end) infinite; }
    .scan { animation: scan 6s ease-in-out infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes orbit-reverse { to { transform: rotate(-360deg); } }
    @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.96) } 50% { opacity:1; transform:scale(1.05) } }
    @keyframes dash { to { stroke-dashoffset:-180; } }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
    @keyframes scan { 0%,100% { transform:translateY(-24px); opacity:0 } 20%,80% { opacity:.35 } 50% { transform:translateY(365px); opacity:.18 } }
    @media (prefers-reduced-motion: reduce) {
      .orbit,.orbit-reverse,.pulse,.dash,.cursor,.scan { animation:none !important; }
    }
  </style>
  <defs><radialGradient id="center"><stop stop-color="#6D28D9" stop-opacity=".3"/><stop offset="1" stop-color="#6D28D9" stop-opacity="0"/></radialGradient></defs>
  <rect width="1200" height="610" rx="24" fill="#F4F7FC" stroke="#C7D4E3" stroke-width="2"/>
  <g class="dash"><path d="M600 300 Q385 175 170 120" fill="none" stroke="#6D28D9" stroke-width="2" stroke-dasharray="8 10" opacity=".65"/><path d="M600 300 Q580 154 560 78" fill="none" stroke="#087F5B" stroke-width="2" stroke-dasharray="8 10" opacity=".65"/><path d="M600 300 Q795 190 990 150" fill="none" stroke="#007FA3" stroke-width="2" stroke-dasharray="8 10" opacity=".65"/><path d="M600 300 Q807 335 1015 440" fill="none" stroke="#A15C00" stroke-width="2" stroke-dasharray="8 10" opacity=".65"/><path d="M600 300 Q580 375 560 520" fill="none" stroke="#C02654" stroke-width="2" stroke-dasharray="8 10" opacity=".65"/><path d="M600 300 Q385 330 170 430" fill="none" stroke="#007FA3" stroke-width="2" stroke-dasharray="8 10" opacity=".65"/></g>
  <circle cx="170" cy="120" r="72" fill="#FFFFFF" stroke="#6D28D9" stroke-width="3"/>
  <circle class="pulse" cx="170" cy="120" r="83" fill="none" stroke="#6D28D9" stroke-width="1" opacity=".25"/>
  <text x="170" y="116" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="800" fill="#132238">RNA</text>
  <text x="170" y="143" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#52677E">foundation models</text><circle cx="560" cy="78" r="72" fill="#FFFFFF" stroke="#087F5B" stroke-width="3"/>
  <circle class="pulse" cx="560" cy="78" r="83" fill="none" stroke="#087F5B" stroke-width="1" opacity=".25"/>
  <text x="560" y="74" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="800" fill="#132238">Clinical</text>
  <text x="560" y="101" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#52677E">ontologies</text><circle cx="990" cy="150" r="72" fill="#FFFFFF" stroke="#007FA3" stroke-width="3"/>
  <circle class="pulse" cx="990" cy="150" r="83" fill="none" stroke="#007FA3" stroke-width="1" opacity=".25"/>
  <text x="990" y="146" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="800" fill="#132238">Graph ML</text>
  <text x="990" y="173" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#52677E">temporal shift</text><circle cx="1015" cy="440" r="72" fill="#FFFFFF" stroke="#A15C00" stroke-width="3"/>
  <circle class="pulse" cx="1015" cy="440" r="83" fill="none" stroke="#A15C00" stroke-width="1" opacity=".25"/>
  <text x="1015" y="436" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="800" fill="#132238">AI tooling</text>
  <text x="1015" y="463" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#52677E">reliability</text><circle cx="560" cy="520" r="72" fill="#FFFFFF" stroke="#C02654" stroke-width="3"/>
  <circle class="pulse" cx="560" cy="520" r="83" fill="none" stroke="#C02654" stroke-width="1" opacity=".25"/>
  <text x="560" y="516" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="800" fill="#132238">Analytics</text>
  <text x="560" y="543" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#52677E">Power BI · DAX</text><circle cx="170" cy="430" r="72" fill="#FFFFFF" stroke="#007FA3" stroke-width="3"/>
  <circle class="pulse" cx="170" cy="430" r="83" fill="none" stroke="#007FA3" stroke-width="1" opacity=".25"/>
  <text x="170" y="426" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="800" fill="#132238">Evaluation</text>
  <text x="170" y="453" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#52677E">tests · ablations</text>
