  <circle cx="600" cy="300" r="102" fill="#FFFFFF" stroke="#6D28D9" stroke-width="4"/>
  <text x="600" y="277" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="850" fill="#132238">RELIABLE AI</text>
