<svg xmlns="http://www.w3.org/2000/svg" width="960" height="116" viewBox="0 0 960 116" role="img" aria-labelledby="title desc">
<title id="title">Continue to selected repositories and public GitHub activity</title>
<desc id="desc">A visual transition from the profile README to GitHub's native pinned repositories and contribution activity.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1">
    <stop offset="0" stop-color="#F6F8FC"/>
    <stop offset="0.5" stop-color="#EEF2FF"/>
    <stop offset="1" stop-color="#F1FBF8"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#7C3AED"/>
    <stop offset="0.5" stop-color="#0891B2"/>
    <stop offset="1" stop-color="#059669"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="958" height="114" rx="20" fill="url(#bg)" stroke="#C8D3E1"/>
<text x="32" y="31" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" fill="#6D28D9">NEXT / LIVE GITHUB LAYER</text>
<text x="32" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Selected repositories</text>
