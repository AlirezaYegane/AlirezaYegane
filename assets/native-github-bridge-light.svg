<path d="M638 51 L652 60 L638 69" fill="none" stroke="#0891B2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="680" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#111827">Public activity</text>
<text x="32" y="92" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#64748B">repositories · engineering signals · contribution history</text>
