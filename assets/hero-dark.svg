<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Alireza Yegane research mission control</title>
  <desc id="desc">Animated research mission-control panel introducing Alireza Yegane, his role in AI and machine learning, Sydney location, and a visual orbit connecting research, engineering, and delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111F"/><stop offset="1" stop-color="#102438"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#35D7FF" stop-opacity=".35"/><stop offset="1" stop-color="#35D7FF" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#28445E" stroke-width="1" opacity=".2"/></pattern>
  </defs>
  <style>
    .orbit { transform-origin: 910px 250px; animation: orbit 24s linear infinite; }
    .orbit-reverse { transform-origin: 910px 250px; animation: orbit-reverse 34s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .dash { animation: dash 10s linear infinite; }
    .cursor { animation: blink 1.1s steps(2,end) infinite; }
    .scan { animation: scan 6s ease-in-out infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes orbit-reverse { to { transform: rotate(-360deg); } }
    @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.96) } 50% { opacity:1; transform:scale(1.05) } }
    @keyframes dash { to { stroke-dashoffset:-180; } }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
    @keyframes scan { 0%,100% { transform:translateY(-24px); opacity:0 } 20%,80% { opacity:.35 } 50% { transform:translateY(365px); opacity:.18 } }
    @media (prefers-reduced-motion: reduce) {
      .orbit,.orbit-reverse,.pulse,.dash,.cursor,.scan { animation:none !important; }
    }
  </style>
  <rect width="1200" height="500" rx="30" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="464" rx="22" fill="url(#grid)" stroke="#28445E" stroke-width="2"/>
  <rect class="scan" x="30" y="42" width="1140" height="3" fill="#35D7FF" opacity=".15"/>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace">
    <circle cx="52" cy="50" r="6" fill="#FF5F57"/><circle cx="74" cy="50" r="6" fill="#FEBC2E"/><circle cx="96" cy="50" r="6" fill="#28C840"/>
    <text x="125" y="57" font-size="15" fill="#9EB2C7">ALIREZA / RESEARCH-MISSION-CONTROL</text>
    <rect x="1000" y="37" width="145" height="28" rx="14" fill="#43D9AD" opacity=".13" stroke="#43D9AD"/>
    <circle class="pulse" cx="1019" cy="51" r="5" fill="#43D9AD"/>
    <text x="1032" y="56" font-size="12" font-weight="700" fill="#43D9AD">SYSTEM ONLINE</text>

    <text x="58" y="122" font-size="16" fill="#43D9AD">$ whoami</text>
    <text x="58" y="177" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="48" font-weight="800" fill="#F5F7FA">Alireza Yegane</text>
    <text x="58" y="218" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#A78BFA">AI/ML Researcher · Data Scientist · Research Software Builder</text>
    <text x="58" y="265" font-size="16" fill="#43D9AD">$ objective</text>
    <text x="58" y="299" font-size="19" fill="#F5F7FA">build reliable AI &amp; data systems</text>
    <text x="58" y="329" font-size="19" fill="#F5F7FA">from evidence -&gt; experiment -&gt; usable software</text>
    <text x="58" y="381" font-size="16" fill="#43D9AD">$ coordinates</text>
    <text x="58" y="414" font-size="18" fill="#F5F7FA">Sydney, Australia · Research Assistant · Macquarie University</text>
    <text x="58" y="455" font-size="14" fill="#9EB2C7">assert evidence &gt; hype</text><rect class="cursor" x="257" y="440" width="11" height="20" fill="#35D7FF"/>
  </g>

  <circle cx="910" cy="250" r="190" fill="url(#glow)" filter="url(#soft)"/>
  <g fill="none" stroke="#28445E" stroke-width="2">
    <circle cx="910" cy="250" r="164"/><circle cx="910" cy="250" r="118" stroke-dasharray="7 9"/><circle cx="910" cy="250" r="72"/>
  </g>
  <g class="orbit" fill="none" stroke="#35D7FF" stroke-width="3" stroke-dasharray="12 12"><circle cx="910" cy="250" r="164"/></g>
  <g class="orbit-reverse" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="5 16"><circle cx="910" cy="250" r="118"/></g>
  <path class="dash" d="M746 250 C790 150 860 120 910 178 C960 236 1020 130 1074 250 C1024 350 956 378 910 322 C864 266 798 370 746 250Z" fill="none" stroke="#43D9AD" stroke-width="2" stroke-dasharray="10 10"/>
  <circle cx="910" cy="250" r="48" fill="#0D1B2A" stroke="#35D7FF" stroke-width="3"/>
  <text x="910" y="243" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="700" fill="#F5F7FA">RELIABLE</text>
  <text x="910" y="265" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="700" fill="#F5F7FA">SYSTEMS</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="700">
    <g><circle class="pulse" cx="910" cy="86" r="11" fill="#A78BFA"/><text x="910" y="67" text-anchor="middle" fill="#A78BFA">RESEARCH</text></g>
    <g><circle class="pulse" cx="1074" cy="250" r="11" fill="#35D7FF"/><text x="1080" y="225" text-anchor="middle" fill="#35D7FF">BUILD</text></g>
    <g><circle class="pulse" cx="910" cy="414" r="11" fill="#43D9AD"/><text x="910" y="448" text-anchor="middle" fill="#43D9AD">DELIVER</text></g>
    <g><circle class="pulse" cx="746" cy="250" r="11" fill="#F6C85F"/><text x="724" y="225" text-anchor="middle" fill="#F6C85F">EVALUATE</text></g>
  </g>
</svg>
